name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm npm publish'
        required: true
        default: ''
      dry_run:
        description: 'Validate the release without publishing to npm'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Safety check: only run if manually confirmed
    if: github.event.inputs.confirm == 'publish'

    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org
        env:
          # npm uses a configured Trusted Publisher first, with this token as fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Validate npm package
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org
